name = "transcript-talk"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# 静态页面由 Cloudflare Assets 托管；未命中静态资源的请求进入 Worker（/api/*）
[assets]
directory = "./public"

# 生产日志（Workers Logs）：dashboard 可查、可按 level/字段过滤，
# 与本地 wrangler dev 终端日志同构（结构化 JSON）
[observability]
enabled = true

# 会话上下文存储：Cloudflare KV（内存优先 + KV 兜底；无需 Redis）
[[kv_namespaces]]
binding = "SESSIONS"
id = "eda7ea8017fd40579bd6e1465d8fd656"

[vars]
# 全部可选——按 README 配置 secrets/vars 后逐项启用
# GEMINI_MODEL = "gemini-3.5-flash"
# OpenAI 兼容供应商（DeepSeek/GLM/Kimi/OpenRouter）——配置 OPENAI_API_KEY 后优先于 Gemini
# OPENAI_API_KEY 走 secret；BASE_URL/MODEL 非敏感可放这里
# OPENAI_BASE_URL = "https://api.deepseek.com/v1"
# OPENAI_MODEL = "deepseek-chat"
# PROXY_HOST = "xxx.webshare.io"     # webshare.io 代理（应对 YouTube 风控）
# PROXY_PORT = "80"
# PROXY_USERNAME = ""
# PROXY_PASSWORD = ""
